# 持续集成：lint、类型检查、Vitest（PostgreSQL 服务）、构建、E2E
# CI: lint, typecheck, Vitest (PostgreSQL service), builds and E2E
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yonlink
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: yonlink_mvp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yonlink" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # 仅 CI 临时数据库使用的非机密密码 / non-secret password for the throwaway CI database
      TEST_DATABASE_URL: postgresql://yonlink:ci-only-password@127.0.0.1:5432/yonlink_mvp_test
      DATABASE_URL: postgresql://yonlink:ci-only-password@127.0.0.1:5432/yonlink_mvp_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --reporter=verbose
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_STATIC_PREVIEW: '1'
      - run: npm run build
      # 只下载浏览器，不经 apt 安装系统依赖（runner 镜像已预装所需库；apt 镜像曾出现 DNS 故障）
      # download the browser only, no apt system deps (the runner image already has them; apt mirrors had DNS failures)
      - run: npx playwright install chromium
      - run: npx playwright test
      # 端到端测试失败时上传截图、操作轨迹与页面快照，便于定位偶发失败（保留 14 天）
      # upload screenshots, traces and page snapshots when E2E fails, to diagnose flaky runs (kept 14 days)
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
