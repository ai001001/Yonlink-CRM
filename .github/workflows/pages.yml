# GitHub Pages 前端部署，调用 Oracle 服务器上的后端 API（演示环境）
# Deploy the frontend to GitHub Pages; it calls the backend API on the Oracle server (demo environment)
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          # 已接入 Oracle 服务器上的真实后端（Caddy + Let's Encrypt HTTPS）
          # connected to the real backend on the Oracle server (Caddy + Let's Encrypt HTTPS)
          NEXT_PUBLIC_STATIC_PREVIEW: '0'
          NEXT_PUBLIC_API_BASE: https://132-226-98-75.sslip.io
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
